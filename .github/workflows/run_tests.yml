name: Record Service GitHub Actions Demo
run-name: ${{ github.actor }} is testing out Record Service
on: [push]
jobs:
  recordService:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
          
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare disposable test configuration
        run: |
          cp .env.example .env
          sed -i "s/^DATABASE_ADMIN_PASSWORD=$/DATABASE_ADMIN_PASSWORD=ci_admin_password/; s/^DATABASE_PASSWORD=$/DATABASE_PASSWORD=ci_app_password/" .env

      - name: Install test requirements
        run: |
          pip install pytest allure-pytest

      - name: Install requirements
        run: |
          pip install -r ./record_service/src/requirements.txt

      - name: Launch services
        continue-on-error: false
        run: |
          make run_tracker

      - name: Check initialization regressions
        run: python -m unittest discover -s tests -v

      - name: Run component tests
        continue-on-error: true
        run: |
          make record_service_component_tests

      - name: Run unit tests
        continue-on-error: true
        run: |
          make record_service_unit_tests
      
      - name: Load test report history
        uses: actions/checkout@v3
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build test report
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Publish test report
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Stop services
        if: always()
        run: |
          make stop_tracker