name: Tracker release for Acer
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_branch:
        description: Tracker branch to test and release (run this workflow from main)
        type: string
        default: main
        required: true
      publish_only:
        description: Publish images without requesting deployment
        type: boolean
        default: false

permissions: {}

jobs:
  resolve:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.ACER_AUTO_DEPLOY == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Resolve source branch
        id: revision
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          SOURCE_REPO: ${{ github.repository }}
          PUSH_SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            git check-ref-format "refs/heads/$SOURCE_BRANCH"
            sha=$(git ls-remote --exit-code "https://github.com/$SOURCE_REPO.git" "refs/heads/$SOURCE_BRANCH" | cut -f1)
          else
            sha=$PUSH_SHA
          fi
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  check:
    needs: resolve
    permissions:
      contents: read
    uses: ./.github/workflows/deployment.yml
    with:
      source_sha: ${{ needs.resolve.outputs.sha }}

  publish:
    needs: [resolve, check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      record: ${{ steps.images.outputs.record }}
      analytics: ${{ steps.images.outputs.analytics }}
      web: ${{ steps.images.outputs.web }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Publish amd64 images and record immutable digests
        id: images
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          for component in record analytics web; do
            case "$component" in
              record) context=record_service/src ;;
              analytics) context=analytic_service/src ;;
              web) context=web_ui/tracker-client ;;
            esac
            image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tracker-$component"
            docker buildx build --platform linux/amd64 --push \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$SOURCE_SHA" \
              --metadata-file "$RUNNER_TEMP/image-$component.json" \
              -t "$image:sha-$SOURCE_SHA" "$context"
            digest=$(jq -er '."containerimage.digest"' "$RUNNER_TEMP/image-$component.json")
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            echo "$component=$digest" >> "$GITHUB_OUTPUT"
          done

  dispatch:
    if: github.event_name == 'push' || !inputs.publish_only
    needs: [resolve, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: acer-dispatch
    permissions: {}
    steps:
      - name: Request deployment from the private control repository
        env:
          CONTROL_REPO: ${{ vars.ACER_CONTROL_REPO }}
          DISPATCH_TOKEN: ${{ secrets.ACER_DISPATCH_TOKEN }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          RECORD: ${{ needs.publish.outputs.record }}
          ANALYTICS: ${{ needs.publish.outputs.analytics }}
          WEB: ${{ needs.publish.outputs.web }}
          EVENT: ${{ github.event_name }}
        run: |
          [[ "$CONTROL_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          : "${DISPATCH_TOKEN:?Configure ACER_DISPATCH_TOKEN in acer-dispatch}"
          mode=manual
          [[ "$EVENT" != push ]] || mode=auto
          jq -n --arg sha "$SOURCE_SHA" --arg mode "$mode" --arg record "$RECORD" \
            --arg analytics "$ANALYTICS" --arg web "$WEB" \
            '{ref:"main",inputs:{operation:$mode,revision:$sha,record:$record,analytics:$analytics,web:$web}}' |
            curl --fail-with-body --silent --show-error --max-time 20 \
              -H "Authorization: Bearer $DISPATCH_TOKEN" -H 'Content-Type: application/json' \
              --data-binary @- "https://api.github.com/repos/$CONTROL_REPO/actions/workflows/acer-deploy.yml/dispatches"
          echo "Requested $mode deployment for $SOURCE_SHA in $CONTROL_REPO."
          echo "Follow the deployment run in the private control repository." >> "$GITHUB_STEP_SUMMARY"
