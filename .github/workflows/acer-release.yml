name: Publish Tracker release images
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_branch:
        description: Tracker branch to test and release (run this workflow from main)
        type: string
        default: main
        required: true

permissions: {}

jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Resolve source branch
        id: revision
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          SOURCE_REPO: ${{ github.repository }}
          PUSH_SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            git check-ref-format "refs/heads/$SOURCE_BRANCH"
            sha=$(git ls-remote --exit-code "https://github.com/$SOURCE_REPO.git" "refs/heads/$SOURCE_BRANCH" | cut -f1)
          else
            sha=$PUSH_SHA
          fi
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  check:
    needs: resolve
    permissions:
      contents: read
    uses: ./.github/workflows/deployment.yml
    with:
      source_sha: ${{ needs.resolve.outputs.sha }}

  publish:
    needs: [resolve, check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Publish amd64 images and record immutable digests
        id: images
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          for component in record analytics web; do
            case "$component" in
              record) context=. dockerfile=record_service/src/Dockerfile ;;
              analytics) context=. dockerfile=analytic_service/src/Dockerfile ;;
              web) context=web_ui/tracker-client dockerfile=web_ui/tracker-client/Dockerfile ;;
            esac
            image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tracker-$component"
            docker buildx build --platform linux/amd64 --push \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$SOURCE_SHA" \
              --metadata-file "$RUNNER_TEMP/image-$component.json" \
              -t "$image:sha-$SOURCE_SHA" -f "$dockerfile" "$context"
            digest=$(jq -er '."containerimage.digest"' "$RUNNER_TEMP/image-$component.json")
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            echo "$component=$digest" >> "$GITHUB_OUTPUT"
          done

      - name: Write the release manifest
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          RECORD: ${{ steps.images.outputs.record }}
          ANALYTICS: ${{ steps.images.outputs.analytics }}
          WEB: ${{ steps.images.outputs.web }}
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tracker-"
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg revision "$SOURCE_SHA" \
            --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg record "${prefix}record@$RECORD" --arg analytics "${prefix}analytics@$ANALYTICS" \
            --arg web "${prefix}web@$WEB" \
            '{version:1,repository:$repo,revision:$revision,run_id:$run,run_attempt:$attempt,
              images:{record:$record,analytics:$analytics,web:$web}}' > "$RUNNER_TEMP/release.json"
          printf 'Published images for commit `%s` (run `%s`).\n' "$SOURCE_SHA" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the release manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acer-release-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release.json
          if-no-files-found: error
          retention-days: 30
