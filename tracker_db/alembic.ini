# Used for manual commands, e.g. from the repository root:
#   alembic -c tracker_db/alembic.ini revision --autogenerate -m "..."
# The database URL comes from DATABASE_* settings (environment or ./.env).
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
