# Install as .github/workflows/acer-deploy.yml in the private control repository.
name: Deploy or roll back Tracker on Acer
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy a published release or restore the previous healthy release
        type: choice
        options: [rollback, auto, manual]
        default: rollback
        required: true
      revision:
        description: Tracker commit SHA (deploy only)
        type: string
      record:
        description: Record image digest (deploy only)
        type: string
      analytics:
        description: Analytics image digest (deploy only)
        type: string
      web:
        description: Web image digest (deploy only)
        type: string

permissions: {}
concurrency:
  group: tracker-acer-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, acer-deploy]
    timeout-minutes: 25
    steps:
      - name: Apply the requested release
        env:
          OPERATION: ${{ inputs.operation }}
          REVISION: ${{ inputs.revision }}
          RECORD: ${{ inputs.record }}
          ANALYTICS: ${{ inputs.analytics }}
          WEB: ${{ inputs.web }}
        run: |
          case "$OPERATION" in
            rollback) sudo -n /usr/local/sbin/tracker-release rollback ;;
            auto|manual)
              sudo -n /usr/local/sbin/tracker-release deploy \
                "$OPERATION" "$REVISION" "$RECORD" "$ANALYTICS" "$WEB" ;;
            *) exit 2 ;;
          esac
