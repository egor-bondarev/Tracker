server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Record API under the same origin, so clients need only one server address.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $record record_service:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$record;
    }

    location = /graphql {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $analytics analytic_service:8001;
        proxy_pass http://$analytics;
    }
}
