services:
  tracker_database:
    image: postgres:17-bookworm
    restart: unless-stopped
    volumes:
      - postgres17_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DATABASE_EXTERNAL_PORT:-5454}:5432"
    environment:
      POSTGRES_USER: ${DATABASE_ADMIN:?Set DATABASE_ADMIN in .env}
      POSTGRES_PASSWORD: ${DATABASE_ADMIN_PASSWORD:?Set DATABASE_ADMIN_PASSWORD in .env}
      POSTGRES_DB: ${DATABASE_DEFAULT_NAME:-postgres}
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  db_init:
    build: ./record_service/src
    restart: "no"
    command: ["python", "create_db.py"]
    env_file: .env
    environment:
      DATABASE_HOST: tracker_database
      DATABASE_PORT: "5432"
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    depends_on:
      tracker_database:
        condition: service_healthy

  record_service:
    build: ./record_service/src
    restart: unless-stopped
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${RECORD_SERVICE_PORT:-8000}:8000"
    env_file: .env
    environment:
      DATABASE_HOST: tracker_database
      DATABASE_PORT: "5432"
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    depends_on:
      tracker_database:
        condition: service_healthy
      db_init:
        condition: service_completed_successfully

  analytic_service:
    build: ./analytic_service/src
    restart: unless-stopped
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "${ANALYTIC_SERVICE_PORT:-8001}:8001"
    env_file: .env
    environment:
      DATABASE_HOST: tracker_database
      DATABASE_PORT: "5432"
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    depends_on:
      tracker_database:
        condition: service_healthy
      db_init:
        condition: service_completed_successfully

volumes:
  # Separate from the legacy Bitnami volume; never reuse incompatible PGDATA.
  postgres17_data:
